name: XONE V0.1 - IPA iPad (non signe)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Construire l'IPA sur macOS
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Recuperer les fichiers du projet
        uses: actions/checkout@v4

      - name: Afficher Xcode installe
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet Xcode
        run: xcodegen generate

      - name: Compiler iOS sans signature
        run: |
          set -o pipefail
          xcodebuild \
            -project XoneEngineTest.xcodeproj \
            -scheme XoneEngineTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/XoneDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Controler la presence du plugin AUv3 et creer l'IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/XoneDerivedData/Build/Products/Release-iphoneos/XoneEngineTest.app"
          EXT="$APP/PlugIns/XoneMidiAU.appex"
          test -d "$APP" || { echo 'ERREUR: .app introuvable'; exit 1; }
          test -d "$EXT" || { echo 'ERREUR: .appex AUv3 absente'; exit 1; }
          test -f "$APP/XoneEngineTest" || { echo 'ERREUR: executable app manquant'; exit 1; }
          test -f "$EXT/XoneMidiAU" || { echo 'ERREUR: executable AUv3 manquant'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:AudioComponents:0:type' "$EXT/Info.plist" | grep -qx aumi
          echo 'Plugin AUv3 present et de type aumi.'
          mkdir -p output/Payload
          ditto "$APP" "output/Payload/XoneEngineTest.app"
          (
            cd output
            /usr/bin/zip -q -r -y XoneEngineTest_V0_1_UNSIGNED.ipa Payload
          )
          /usr/bin/unzip -l output/XoneEngineTest_V0_1_UNSIGNED.ipa | grep -E 'Payload/XoneEngineTest.app/PlugIns/XoneMidiAU.appex/(Info.plist|XoneMidiAU)'

      - name: Mettre l'IPA a disposition
        uses: actions/upload-artifact@v4
        with:
          name: XoneEngineTest_V0_1_IPA
          path: output/XoneEngineTest_V0_1_UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
