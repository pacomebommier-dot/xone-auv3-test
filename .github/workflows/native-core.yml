name: Native core structural tests
on:
  push:
    branches: ['audit/native-l01-2026-10-26']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Existing V0.1 transform tests
        run: bash Tests/run.sh
      - name: Structural core, warnings and sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -g Tests/test_engine.cpp -o /tmp/xone-core-test
          /tmp/xone-core-test
